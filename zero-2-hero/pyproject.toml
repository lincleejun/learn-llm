[project]
name = "zero-2-hero"
version = "0.1.0"
description = "Karpathy zero-to-hero 学习代码"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "plotext<6",
    "graphviz>=0.21",
    "torch>=2.13.0",
]

[project.scripts]
micrograd = "micrograd.main:main"
# 以后新增目录时：加一个包目录 + 在这里加一行入口，如
# makemore = "makemore.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["micrograd"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
